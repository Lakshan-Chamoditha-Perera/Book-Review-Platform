spring.application.name=apigatewayservice
spring.main.web-application-type=reactive
server.port=9000

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.preferIpAddress=true

# JWT Configuration
# IMPORTANT: This secret must be shared with all services (userservice, bookservice, etc.)
# The secret is BASE64-encoded and must be at least 256 bits (32 bytes) after decoding
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Public endpoints (no authentication required)
api.public.endpoints=/api/v1/auth/**,/actuator/**,/eureka/**

# Logging Configuration
logging.level.root=INFO
logging.level.com.bookreviewplatform.apigatewayservice=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.reactor.netty=INFO

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/apigatewayservice.log


# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always