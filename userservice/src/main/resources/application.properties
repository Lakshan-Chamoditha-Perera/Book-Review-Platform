spring.application.name=userservice

server.port=0

spring.datasource.url=jdbc:mysql://localhost:3306/users_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Logging Configuration
logging.level.root=INFO
logging.level.com.bookreviewplatform.userservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/userservice.log
logging.file.max-size=10MB
logging.file.max-history=30


# JWT Configuration
# IMPORTANT: This secret MUST match the API Gateway secret exactly
# The secret is BASE64-encoded and must be at least 256 bits (32 bytes) after decoding
# Change jwt.secret in production to a secure 256-bit (32+ character) secret key
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
# JWT token expiration time in milliseconds (24 hours = 86400000ms)